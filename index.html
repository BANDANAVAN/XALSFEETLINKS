<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XALSFEET</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600&family=Cinzel:wght@700&display=swap">
<style>
:root{
  --bg:#f2efe8; --text:#1d2a33; --muted:#5b6a73; --card:#fffdf8; --line:#d9d3c4; --gold:#9a6b12;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1a22; --text:#e8e4d8; --muted:#97a6ae; --card:#16252f; --line:#2a3d49; --gold:#e0b04a;}
}
:root[data-theme="dark"]{--bg:#0f1a22; --text:#e8e4d8; --muted:#97a6ae; --card:#16252f; --line:#2a3d49; --gold:#e0b04a;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* WoW look: fixed dark stone and leather with gold trim, in every mode */
:root:root:root{--bg:#14100c;--text:#eadfc4;--muted:#b3a483;--card:#211a13;--line:#5a4527;--gold:#d4a63c;color-scheme:dark}
h1,h2{color:var(--gold)}
h1{text-shadow:0 2px 8px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(ellipse 90% 420px at 50% 0%,#3d2d1b,transparent);background-repeat:no-repeat;color:var(--text);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:48px 20px 64px}
h1{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:700;text-align:center;font-size:clamp(2.4rem,8vw,3.6rem);margin:0 0 32px;letter-spacing:.04em}
.lead{color:var(--muted);margin:0 auto 28px;max-width:52ch;text-align:center}
.lead a{color:var(--gold);font-weight:600;text-decoration:none}
.lead a:hover{text-decoration:underline}
.lead a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.join{text-align:center;margin:0 0 36px}
.join a{display:inline-block;padding:12px 32px;border-radius:999px;font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:700;font-size:1.05rem;letter-spacing:.06em;color:#fff;text-decoration:none;background:linear-gradient(165deg,#7782f8 0%,#4752c4 100%);border:1px solid #98a1ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s}
.join a:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 24px rgba(88,101,242,.7),0 10px 20px rgba(0,0,0,.5)}
.join a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h2{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.04em;text-align:center;font-size:1.5rem;margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line)}
section+section{margin-top:40px}
.search{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:24px}
.search:focus-visible,.banner:focus-visible,.toggle:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.list{grid-template-columns:1fr}}
.list.single{grid-template-columns:minmax(0,calc(50% - 8px));justify-content:center}
@media (max-width:720px){.list.single{grid-template-columns:1fr}}
#list4:not(.single) .banner:last-child:nth-child(odd){grid-column:1 / -1;justify-self:center;width:calc(50% - 8px)}
@media (max-width:720px){#list4:not(.single) .banner:last-child:nth-child(odd){grid-column:auto;width:auto}}
.banner{display:flex;align-items:stretch;min-height:83px;position:relative;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;background:linear-gradient(165deg,#2e2418 0%,var(--card) 60%);border:1px solid #6b5230;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s,border-color .2s}
.banner::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.03) 38%,transparent 58%)}
.banner:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px var(--gold),0 0 24px rgba(212,166,60,.5),0 10px 20px rgba(0,0,0,.5)}
.art{position:relative;overflow:hidden;margin:8px 0 8px 8px;border-radius:10px;flex:0 0 90px;display:flex;align-items:center;justify-content:center;font-family:Marcellus,Georgia,serif;font-size:1.9rem;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);background-size:cover;background-position:center}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{padding:11px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.name{font-family:Marcellus,Georgia,serif;font-size:1.1rem;margin:0}
.desc{margin:2px 0 0;color:var(--muted);font-size:.85rem}
#list3 .desc,#list4 .desc,#live-list .desc{display:none}
.tag{margin-top:4px;font-size:.75rem;color:var(--gold);font-weight:600}
.live{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.live{grid-template-columns:1fr}}
.player{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.frame{position:relative;aspect-ratio:16/9;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cap{display:block;padding:10px 14px;font-family:Marcellus,Georgia,serif;font-size:1.1rem;color:inherit;text-decoration:none}
.cap:hover{color:var(--gold)}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.role{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 8px;border-radius:14px;background:linear-gradient(165deg,#2e2418 0%,var(--card) 60%);border:1px solid #6b5230;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.45);color:var(--gold);font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:700;font-size:1.25rem;letter-spacing:.08em}
@media (max-width:480px){.role{font-size:1rem;padding:16px 4px}}
.role small{font-family:Figtree,system-ui,sans-serif;font-weight:400;font-size:.85rem;letter-spacing:0;color:var(--muted)}
.role small.need{color:#ff5a5f;font-weight:700;font-size:1rem;letter-spacing:.04em}
.role .names{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-family:Figtree,system-ui,sans-serif;font-weight:700;font-size:1rem;letter-spacing:.04em}
.role .names .y{color:#ffd23f}
.role .names .g{color:#4ade80}
.role .names .r{color:#ff5a5f}
.role .names .br{flex-basis:100%;height:0}
.roles.one{grid-template-columns:minmax(0,calc(50% - 8px));justify-content:center}
@media (max-width:720px){.roles.one{grid-template-columns:1fr}}
#list{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){#list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){#list{grid-template-columns:1fr}}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;margin-top:40px;align-items:start}
.pair>section{margin-top:0}
.pair .list{grid-template-columns:1fr}
.pair #list4:not(.single) .banner:last-child:nth-child(odd){grid-column:auto;width:auto;justify-self:stretch}
@media (max-width:720px){.pair{grid-template-columns:1fr;gap:40px}}
.art svg{display:block}
.adbanner{display:block;justify-self:center;width:100%;max-width:320px;border-radius:14px;overflow:hidden;border:1px solid #6b5230;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s,border-color .2s}
.adbanner img{display:block;width:100%;height:auto}
.adbanner:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 24px rgba(212,166,60,.5),0 10px 20px rgba(0,0,0,.5)}
.adbanner:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:0 0 40px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px;padding:10px 6px;border-radius:12px;text-align:center}
.day b{font-family:Cinzel,Georgia,"Times New Roman",serif;font-size:1.05rem;letter-spacing:.06em}
.day span{font-size:.75rem;font-weight:600;line-height:1.25}
.day.on{background:linear-gradient(165deg,#3f9a4c 0%,#256b32 100%);border:1px solid #7ddc8a;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px rgba(0,0,0,.45)}
.day.off{background:#1a1613;border:1px solid #3a342c;color:#6f675a;opacity:.75}
@media (max-width:720px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
.soon{cursor:default}
.soon:hover{transform:none;border-color:#6b5230;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.45)}
.toggle[hidden]{display:none}
.toggle{display:block;margin:12px auto 0;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:.9rem;cursor:pointer}
.toggle:hover{border-color:var(--gold)}
.empty{color:var(--muted);padding:24px 0}
#live-empty{font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-align:center}
@media (max-width:480px){.art{flex-basis:64px;font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){.banner{transition:none}}
</style>
</head>
<body>
<main>
  <h1>XALSFEET</h1>
  <div class="week" role="list" aria-label="Weekly schedule">
    <div class="day on" role="listitem"><b>MON</b><span>5PM – 5AM EST</span></div>
    <div class="day on" role="listitem"><b>TUE</b><span>5PM – 5AM EST</span></div>
    <div class="day off" role="listitem"><b>WED</b></div>
    <div class="day off" role="listitem"><b>THU</b></div>
    <div class="day on" role="listitem"><b>FRI</b><span>5PM – 5AM EST</span></div>
    <div class="day off" role="listitem"><b>SAT</b></div>
    <div class="day off" role="listitem"><b>SUN</b></div>
  </div>
  <section>
    <h2>Socials</h2>
    <div class="list" id="list3"></div>
    <p class="empty" id="empty3" hidden></p>
  </section>
  <section>
    <h2>Online Resources</h2>
    <div class="list" id="list2"></div>
    <p class="empty" id="empty2" hidden></p>
  </section>
  <section>
    <h2>Addons</h2>
    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden></p>
  </section>
  <section>
    <h2>Class Discords</h2>
    <div class="list" id="list4"></div>
    <p class="empty" id="empty4" hidden></p>
  </section>
</main>

  {name:"Shaman", icon:"shaman", desc:"Shaman class community.", tag:"Discord", url:"https://discord.gg/VvBwBu2", color:"#1f4fa0", image:"https://warcraft.wiki.gg/images/ClassIcon_shaman.png?fa2e62"},
  {name:"Warlock", icon:"warlock", desc:"Warlock class community.", tag:"Discord", url:"https://discord.gg/D6TrRkq", color:"#5a4fa8", image:"https://warcraft.wiki.gg/images/ClassIcon_warlock.png?2afb06"},
  {name:"Warrior", icon:"warrior", desc:"Warrior class community.", tag:"Discord", url:"https://discord.gg/WEQc4Njw2x", color:"#8a6a3d", image:"https://warcraft.wiki.gg/images/ClassIcon_warrior.png?2c4dad"}
];


/* Simple class emblems drawn as inline SVG, so they show anywhere. */
const ICONS = {
  druid:'<circle cx="5.5" cy="11" r="1.8"/><circle cx="9.5" cy="6.5" r="1.8"/><circle cx="14.5" cy="6.5" r="1.8"/><circle cx="18.5" cy="11" r="1.8"/><path d="M12 21c-3 0-5-1.6-5-3.6 0-2.2 2.4-4.4 5-4.4s5 2.2 5 4.4c0 2-2 3.6-5 3.6z"/>',
  hunter:'<path d="M6 3c9 2 9 16 0 18M6 3v18M3 12h17M16 8l4 4-4 4"/>',
  mage:'<path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/>',
  paladin:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M12 7v9M8.5 10.5h7"/>',
  priest:'<circle cx="12" cy="12" r="9"/><path d="M12 6v12M8 10h8"/>',
  rogue:'<path d="M12 2l3 9-3 3-3-3z"/><path d="M7 14h10M12 14v7"/>',
  shaman:'<path d="M13 2L5 13h6l-1 9 8-12h-6z"/>',
  warlock:'<path d="M12 3C7.5 3 5 6 5 9.5c0 2.3 1 3.7 2.5 4.6V18h9v-3.9C18 13.2 19 11.8 19 9.5 19 6 16.5 3 12 3z"/><circle cx="9.3" cy="10" r="1.4"/><circle cx="14.7" cy="10" r="1.4"/><path d="M10.5 18v3M13.5 18v3"/>',
  warrior:'<path d="M4 4l11 11M20 4L9 15M13 17l4-4M11 17l-4-4M15 15l5 5M9 15l-5 5"/>'
};

const OPEN = {};

function renderInto(items, list, empty, f){
  list.textContent = '';
  let shown = 0;
  const LIMIT = list.id==='list4' ? 0 : (list.id==='live-list' || list.id==='list3') ? 99 : list.id==='list' ? 6 : 2;
  const collapsed = !OPEN[list.id] && !f;
  items.forEach(a=>{
    if(f && !(a.name+' '+a.desc+' '+a.tag).toLowerCase().includes(f)) return;
    shown++;
    if(collapsed && shown>LIMIT) return;
    if(a.banner){
      const l = document.createElement('a');
      l.className = 'adbanner';
      l.href = a.url;
      l.target = '_blank';
      l.rel = a.sponsored ? 'noopener noreferrer sponsored' : 'noopener noreferrer';
      const im = document.createElement('img');
      im.src = a.banner;
      im.alt = a.name;
      l.append(im);
      list.append(l);
      return;
    }
    const link = document.createElement('a');
    link.className = 'banner';
    if(a.url){
      link.href = a.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    } else {
      link.classList.add('soon');
    }

    const art = document.createElement('div');
    art.className = 'art';
    art.setAttribute('aria-hidden','true');
    art.style.background = 'linear-gradient(135deg,'+a.color+',#10202b)';
    const letter = document.createElement('span');
    letter.textContent = a.name.charAt(0);
    if(a.icon && ICONS[a.icon]){
      letter.innerHTML = '<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">'+ICONS[a.icon]+'</svg>';
    }
    art.append(letter);
    const imgUrl = a.image || (a.twitch ? 'https://unavatar.io/twitch/'+encodeURIComponent(a.twitch) : '');
    if(imgUrl){
      const img = document.createElement('img');
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.onload = ()=>{ letter.hidden = true; };
      img.onerror = ()=>img.remove();
      img.src = imgUrl;
      art.append(img);
    }

    const info = document.createElement('div');
    info.className = 'info';
    const n = document.createElement('p'); n.className='name'; n.textContent = a.name;
    const d = document.createElement('p'); d.className='desc'; d.textContent = a.desc;
    info.append(n,d);
    if(a.tag){ const t=document.createElement('span'); t.className='tag'; t.textContent=a.tag; info.append(t); }

    link.append(art,info);
    list.append(link);
  });
  list.classList.toggle('single', shown===1);
  let btn = document.getElementById('t-'+list.id);
  if(!btn){
    btn = document.createElement('button');
    btn.id = 't-'+list.id;
    btn.type = 'button';
    btn.className = 'toggle';
    btn.setAttribute('aria-controls', list.id);
    btn.addEventListener('click',()=>{ OPEN[list.id] = !OPEN[list.id]; render(); });
    list.after(btn);
  }
  btn.hidden = Boolean(f) || shown<=LIMIT;
  btn.textContent = OPEN[list.id] ? '▴ Show less ▴' : '▾ Show all ▾';
  btn.setAttribute('aria-expanded', String(Boolean(OPEN[list.id])));
  empty.textContent = items.length ? 'No matches for that search.' : 'Nothing here yet.';
  empty.hidden = shown>0;
}
function render(filter){
  const f = (filter||'').trim().toLowerCase();
  renderInto(ADDONS, document.getElementById('list'), document.getElementById('empty'), f);
  renderInto(RESOURCES, document.getElementById('list2'), document.getElementById('empty2'), f);
  renderInto(GUILD_SOCIALS, document.getElementById('list3'), document.getElementById('empty3'), f);
  renderInto(CLASS_DISCORDS, document.getElementById('list4'), document.getElementById('empty4'), f);
}
render();
</script>
